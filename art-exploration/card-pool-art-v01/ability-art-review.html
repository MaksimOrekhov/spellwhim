<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spellwhim — neutral ability art review</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:36px;background:#171b2d;color:#f8edcd;font:18px/1.4 'Segoe UI',sans-serif}
    h1{margin:0 0 8px;font-size:32px}p{margin:0 0 26px;color:#c9c3bd}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
    figure{margin:0;padding:12px;background:#25283a;border:1px solid #78694f;border-radius:14px;box-shadow:0 6px 18px #0005}
    img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#121521}figcaption{padding:10px 2px 2px}
    strong{display:block;font-size:17px}.meta{display:block;margin-top:3px;color:#c5b58d;font-size:14px}
    @media(max-width:1150px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <h1>Ability art · нейтральные фоны · 8 карт v0.1</h1>
  <p>Review drafts, 768×768 JPEG. Все действия и классовые палитры различаются; adventure-specific фон отсутствует. Ничего не подключено автоматически.</p>
  <main class="grid">
    <figure><img src="card-warrior-stance-strike.jpg" alt="Воин — Удар из стойки"><figcaption><strong>Удар из стойки</strong><span class="meta">Воин · сталь, янтарные искры, кинетика</span></figcaption></figure>
    <figure><img src="card-warrior-wound-clamp.jpg" alt="Воин — Зажать рану"><figcaption><strong>Зажать рану</strong><span class="meta">Воин · физический зажим, защита, тик</span></figcaption></figure>
    <figure><img src="card-warrior-covering-counter.jpg" alt="Воин — Перехват удара"><figcaption><strong>Перехват удара</strong><span class="meta">Воин · блок щитом и ответный удар</span></figcaption></figure>
    <figure><img src="card-warrior-crushing-swing.jpg" alt="Воин — Сокрушительный замах"><figcaption><strong>Сокрушительный замах</strong><span class="meta">Воин · широкая дуга двуручного клинка</span></figcaption></figure>
    <figure><img src="card-mage-arcane-mark.jpg" alt="Маг — Арканная метка"><figcaption><strong>Арканная метка</strong><span class="meta">Маг · сапфир, аметист, знак и добор</span></figcaption></figure>
    <figure><img src="card-mage-ice-echo.jpg" alt="Маг — Ледяное эхо"><figcaption><strong>Ледяное эхо</strong><span class="meta">Маг · ледяная волна из арканного фокуса</span></figcaption></figure>
    <figure><img src="card-mage-frost-seal.jpg" alt="Маг — Синяя печать"><figcaption><strong>Синяя печать</strong><span class="meta">Маг · руна запечатывает алые частицы</span></figcaption></figure>
    <figure><img src="card-mage-blood-resonance.jpg" alt="Маг — Кровавый резонанс"><figcaption><strong>Кровавый резонанс</strong><span class="meta">Маг · алые искры превращаются в arcane-всплеск</span></figcaption></figure>
  </main>
</body>
</html>
