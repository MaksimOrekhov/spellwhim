[package]
name = "spellwhim-battle-prototype"
version = "0.1.0"
description = "Spellwhim battle prototype"
authors = ["you"]
edition = "2021"

[lib]
name = "spellwhim_battle_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
